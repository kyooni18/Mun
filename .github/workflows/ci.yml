name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: [18.3.1, 19.2.8]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select React compatibility version
        run: >-
          pnpm add --save-dev --ignore-scripts
          react@${{ matrix.react }}
          react-dom@${{ matrix.react }}
          ${{ matrix.react == '18.3.1' && '@types/react@18.3.23 @types/react-dom@18.3.7' || '@types/react@19.2.18 @types/react-dom@19.2.4' }}
      - run: pnpm test
      - run: pnpm run demo:build
      - run: pnpm run demo:vue:build
      - run: pnpm run demo:web:build
      - run: pnpm run demo:parity:build
      - run: pnpm run demo:showcase:build

  native:
    name: Native ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Native project, manifest, formatter and development state machine
        run: node --test tests/native-dx.test.mjs
      - name: Hot-reload compatibility analysis, dev protocol and dev loop
        run: node --test tests/hot-reload.test.mjs tests/incremental-lowering.test.mjs
      - name: Editor protocols and extension packaging
        run: node --test tests/editor-integrations.test.mjs tests/vscode-extension.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev libx11-dev libxcb1-dev xvfb mesa-vulkan-drivers
      - name: Check native Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - name: Test native workspace
        run: cargo test --manifest-path native/Cargo.toml --workspace --locked
      - name: Compile fresh source and run native integration contracts
        run: node scripts/verify-native-contracts.mjs
      - name: Compile native executable
        run: cargo build --manifest-path native/Cargo.toml -p mun-native --locked
      - name: Native window, GPU, text and accessibility smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/native-smoke.mjs
      - name: Native window, GPU, text and accessibility smoke
        if: runner.os != 'Linux'
        run: node scripts/native-smoke.mjs
      - name: Verify packaged native host from clean consumer (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/verify-native-package.mjs
      - name: Verify packaged native host from clean consumer
        if: runner.os != 'Linux'
        run: node scripts/verify-native-package.mjs

  browser:
    name: Browser interaction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build production browser fixtures
        run: pnpm run demo:all:build
      - name: Validate production browser fixtures
        run: pnpm run test:browser:built
      - name: Start demo server
        run: pnpm exec vite --config examples/vite.config.ts --host 127.0.0.1 > mun-vite.log 2>&1 &
      - name: Start Vue demo server
        run: pnpm exec vite --config examples/vue.vite.config.ts --host 127.0.0.1 --port 5175 > mun-vue-vite.log 2>&1 &
      - name: Start Web demo server
        run: pnpm exec vite --config examples/web.vite.config.ts --host 127.0.0.1 --port 5174 > mun-web-vite.log 2>&1 &
      - name: Start parity React server
        run: pnpm exec vite --config examples/parity-react.vite.config.ts --host 127.0.0.1 --port 5180 > mun-parity-react.log 2>&1 &
      - name: Start parity Vue server
        run: pnpm exec vite --config examples/parity-vue.vite.config.ts --host 127.0.0.1 --port 5181 > mun-parity-vue.log 2>&1 &
      - name: Start parity Web server
        run: pnpm exec vite --config examples/parity-web.vite.config.ts --host 127.0.0.1 --port 5182 > mun-parity-web.log 2>&1 &
      - name: Start Showcase server
        run: pnpm exec vite --config examples/showcase.vite.config.ts --host 127.0.0.1 --port 5183 > mun-showcase-vite.log 2>&1 &
      - name: Wait for renderer demo servers
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:5175/vue-index.html >/dev/null \
              && curl --fail --silent http://127.0.0.1:5174/web-index.html >/dev/null \
              && curl --fail --silent http://127.0.0.1:5180/parity-react-index.html >/dev/null \
              && curl --fail --silent http://127.0.0.1:5181/parity-vue-index.html >/dev/null \
              && curl --fail --silent http://127.0.0.1:5182/parity-web-index.html >/dev/null \
              && curl --fail --silent http://127.0.0.1:5183/showcase-index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat mun-vite.log
          cat mun-vue-vite.log
          cat mun-web-vite.log
          cat mun-parity-react.log
          cat mun-parity-vue.log
          cat mun-parity-web.log
          cat mun-showcase-vite.log
          exit 1
      - run: MUN_BROWSER_URL=http://127.0.0.1:5173 pnpm run test:browser
      - run: MUN_VUE_BROWSER_URL=http://127.0.0.1:5175/vue-index.html pnpm run test:browser:vue
      - run: MUN_WEB_BROWSER_URL=http://127.0.0.1:5174/web-index.html pnpm run test:browser:web
      - run: MUN_PARITY_REACT_URL=http://127.0.0.1:5180/parity-react-index.html MUN_PARITY_VUE_URL=http://127.0.0.1:5181/parity-vue-index.html MUN_PARITY_WEB_URL=http://127.0.0.1:5182/parity-web-index.html pnpm run test:browser:parity
      - run: MUN_SHOWCASE_URL=http://127.0.0.1:5183/showcase-index.html pnpm run test:browser:showcase

  benchmark:
    name: Modifier benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run benchmark:modifiers:ci
      - name: Run performance benchmark
        run: pnpm run benchmark:performance:ci
